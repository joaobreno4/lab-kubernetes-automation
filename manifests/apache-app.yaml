apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-apache
  namespace: lab-estudos
  labels:
    app: meu-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meu-apache
  template:
    metadata:
      labels:
        app: meu-apache
    spec:
      containers:
      - name: apache
        image: httpd:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: lab-estudos
spec:
  selector:
    app: meu-apache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
